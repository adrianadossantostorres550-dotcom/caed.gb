<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CAEd Math Lab 9</title>
<style>
:root{--bg:#050b1a;--card:rgba(20,34,66,.6);--tx:#e6f1ff;--mu:#8ca3c7;--cy:#22e5ff;--vi:#8b6cff;--ok:#3ddc97;--er:#ff6b7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 85% -10%,rgba(139,108,255,.22),transparent 45%),radial-gradient(circle at 0 100%,rgba(34,229,255,.12),transparent 40%),var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:860px;margin:auto;padding:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
nav button,.b{background:var(--card);color:var(--tx);border:1px solid rgba(34,229,255,.25);border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer;transition:.2s}
nav button:hover,.b:hover{border-color:var(--cy);transform:translateY(-1px)}
nav button.on,.b.p{background:linear-gradient(135deg,var(--cy),#4aa3ff);color:#04101f;border:0;font-weight:600}
h1{font-size:1.5rem;margin:0 0 4px}h1 span{color:var(--cy)}h2{font-size:1.15rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid rgba(139,108,255,.25);border-radius:16px;padding:18px;margin-bottom:14px;backdrop-filter:blur(8px);animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.st b{display:block;font-size:1.8rem;color:var(--cy)}.mu{color:var(--mu);font-size:.9rem}
.bar{height:9px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden;margin:4px 0 10px;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vi),var(--cy));border-radius:9px;animation:w .9s ease both}
.bar u{position:absolute;left:70%;top:0;bottom:0;width:2px;background:#fff8}
@keyframes w{from{width:0}}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:rgba(255,255,255,.04);color:var(--tx);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px;font:inherit;cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--cy)}.opt.sel{border-color:var(--cy);background:rgba(34,229,255,.12)}
.opt.ok{border-color:var(--ok);background:rgba(61,220,151,.15)}.opt.no{border-color:var(--er);background:rgba(255,107,122,.14);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:20px;background:rgba(139,108,255,.25);margin-right:6px}
.note{border-left:3px solid var(--cy);padding:8px 12px;background:rgba(34,229,255,.07);border-radius:6px;margin-top:10px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}main{position:relative;z-index:1}h1{letter-spacing:.04em;text-shadow:0 0 18px rgba(34,229,255,.45)}
#intro{position:fixed;inset:0;z-index:50;background:rgba(5,11,26,.55);display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;transition:opacity .6s}
#intro svg{width:min(92vw,640px)}.dr{fill:transparent;stroke:#22e5ff;stroke-width:1.2;stroke-dasharray:900;stroke-dashoffset:900;font:700 64px 'Segoe UI',sans-serif;animation:dr 3s ease forwards,fl 1s 2.7s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fl{to{fill:#22e5ff}}
#tg{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:8px;z-index:60;font-size:.75rem;padding:5px 9px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px}.hd h1{margin:0}.pf{position:relative;margin-left:auto}.pb{display:flex;align-items:center;gap:8px;max-width:62vw}.pb b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.pm{position:absolute;right:0;top:calc(100% + 6px);z-index:30;display:flex;flex-direction:column;gap:6px;background:#0b1730;padding:8px;border:1px solid #22e5ff44;border-radius:12px;min-width:190px}.pm .b{text-align:left}
.cin{animation:cin 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes cin{from{opacity:0;transform:perspective(600px) rotateX(12deg) scale(.92);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.stp{opacity:0;animation:in .5s ease forwards;margin-top:6px}.pl{animation:pl 1.6s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
svg g[role=button]{cursor:pointer}svg g[role=button]:focus{outline:2px solid #fff}
.foc #bg{opacity:.28;transition:opacity .6s}select{background:#0b1730;color:var(--tx);border:1px solid #22e5ff55;border-radius:8px;padding:8px;font:inherit}.chip{display:inline-block;margin:3px;padding:6px 10px;border:1px solid #22e5ff44;border-radius:20px;cursor:pointer}.chip input{margin-right:6px}
body.noan *{animation:none!important;transition:none!important}body.noan .stp,body.noan .card{opacity:1!important}
input[type=range]{accent-color:#22e5ff;vertical-align:middle}input[type=number]{background:#0b1730;color:var(--tx);border:1px solid #22e5ff55;border-radius:8px;padding:4px}
.prof{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.tl{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;margin:14px 0;padding:4px}
.msg{padding:10px 14px;border-radius:14px;max-width:92%;border:1px solid rgba(34,229,255,.2);background:var(--card)}.msg.u{align-self:flex-end;background:rgba(139,108,255,.28)}.msg p{margin:6px 0}.msg details{margin:6px 0}.msg summary{cursor:pointer;color:var(--cy)}
#ti{flex:1;min-width:180px;background:#0b1730;color:#e6f1ff;border:1px solid #22e5ff55;border-radius:10px;padding:12px;font:inherit}nav button:first-child{border-color:var(--vi)}
</style></head><body><canvas id="bg" aria-hidden="true"></canvas><button id="tg" class="b">Animações: ligadas</button><div id="intro"><svg viewBox="0 0 600 110" role="img" aria-label="CAEd MATH LAB 9"><text x="300" y="72" text-anchor="middle" class="dr">CAEd MATH LAB 9</text></svg><button id="sk" class="b">Pular abertura</button></div><main id="app"></main>
<script>
const M=["Números racionais","Razão e proporção","Porcentagem","Equações","Sistemas de equações","Geometria plana","Pitágoras e semelhança","Grandezas e medidas","Gráficos e estatística","Probabilidade e contagem"];
// [módulo, nível, enunciado, alternativas, índice correto, resolução, dica]
const Q=[
[0,"Básico","Qual é o resultado de 3/4 + 1/6?",["11/12","4/10","1/2","9/24"],0,"MMC(4,6)=12. 3/4=9/12 e 1/6=2/12. Soma: 11/12. Somar numeradores e denominadores (4/10) é erro comum.","Procure um denominador comum."],
[0,"Intermediário","Qual é o valor de √144 − 2³?",["16","4","10","−4"],1,"√144=12 e 2³=8. 12−8=4.","Calcule a raiz e a potência separadamente."],
[1,"Básico","Cinco canetas custam R$ 12,00. Quanto custam 15 canetas, mantendo o preço?",["R$ 24,00","R$ 30,00","R$ 36,00","R$ 48,00"],2,"15 é o triplo de 5, então o preço triplica: 3 × 12 = 36.","Quantas vezes 15 é maior que 5?"],
[1,"Intermediário","Em um mapa com escala 1 : 200 000, dois pontos estão a 3 cm. Qual é a distância real?",["600 m","2 km","60 km","6 km"],3,"3 × 200 000 = 600 000 cm = 6 000 m = 6 km.","Converta cm para km no final."],
[2,"Básico","Uma camisa de R$ 150,00 tem 20% de desconto. Qual é o preço final?",["R$ 130,00","R$ 120,00","R$ 30,00","R$ 170,00"],1,"20% de 150 = 30. Preço final: 150 − 30 = 120.","Calcule primeiro o valor do desconto."],
[2,"Avançado","Um valor de R$ 200,00 sofre dois aumentos sucessivos de 10%. Qual é o valor final?",["R$ 240,00","R$ 220,00","R$ 244,00","R$ 242,00"],3,"Primeiro: 200 × 1,1 = 220. Segundo: 220 × 1,1 = 242. Os aumentos não se somam (seria 240).","O segundo aumento incide sobre o novo valor."],
[3,"Básico","Se 3x + 5 = 20, qual é o valor de x?",["5","15","25/3","8"],0,"3x = 20 − 5 = 15, então x = 15 ÷ 3 = 5.","Isole o termo com x."],
[3,"Intermediário","O dobro de um número, somado com 7, resulta em 31. Que número é esse?",["24","19","12","10"],2,"2n + 7 = 31 → 2n = 24 → n = 12.","Monte a equação 2n + 7 = 31."],
[4,"Básico","Se x + y = 10 e x − y = 2, qual é o valor de x?",["4","6","8","12"],1,"Somando as equações: 2x = 12, logo x = 6 (e y = 4).","Some as duas equações."],
[4,"Intermediário","2 cadernos e 1 lápis custam R$ 11,00. 1 caderno e 1 lápis custam R$ 7,00. Qual o preço de um caderno?",["R$ 3,00","R$ 5,00","R$ 4,00","R$ 7,00"],2,"Subtraindo: (2c + l) − (c + l) = 11 − 7 → c = 4. O lápis custa R$ 3,00.","Subtraia a segunda equação da primeira."],
[5,"Básico","Em um triângulo, dois ângulos medem 50° e 70°. Quanto mede o terceiro?",["50°","70°","60°","120°"],2,"A soma dos ângulos internos é 180°. 180 − 50 − 70 = 60°.","A soma é sempre 180°."],
[5,"Intermediário","Um retângulo tem perímetro 20 cm e um lado de 6 cm. Qual é sua área?",["24 cm²","60 cm²","36 cm²","20 cm²"],0,"2(6 + b) = 20 → b = 4. Área = 6 × 4 = 24 cm².","Ache primeiro o outro lado."],
[6,"Básico","Um triângulo retângulo tem catetos 6 cm e 8 cm. Quanto mede a hipotenusa?",["14 cm","7 cm","12 cm","10 cm"],3,"h² = 6² + 8² = 36 + 64 = 100, logo h = 10 cm.","Use h² = a² + b²."],
[6,"Intermediário","Um poste de 2 m projeta sombra de 3 m. No mesmo instante, um prédio projeta sombra de 15 m. Qual a altura do prédio?",["10 m","7,5 m","30 m","12 m"],0,"Triângulos semelhantes: 2/3 = h/15 → h = 30/3 = 10 m.","Monte a proporção entre alturas e sombras."],
[7,"Básico","Quantos metros há em 2,5 km?",["25 m","250 m","2 500 m","25 000 m"],2,"1 km = 1 000 m, então 2,5 × 1 000 = 2 500 m.","Multiplique por 1 000."],
[7,"Avançado","Uma caixa-d’água tem formato de bloco de 3 m × 2 m × 4 m. Quantos litros ela comporta, sabendo que 1 m³ = 1 000 L?",["2 400 L","24 000 L","9 000 L","240 L"],1,"V = 3 × 2 × 4 = 24 m³ = 24 × 1 000 = 24 000 L.","Calcule o volume em m³ antes de converter."],
[8,"Básico","As notas de um aluno foram 6, 8, 7, 9 e 5. Qual é a média aritmética?",["7","8","6","35"],0,"Soma = 35; 35 ÷ 5 = 7.","Some tudo e divida pela quantidade."],
[8,"Intermediário","Uma loja vendeu 12 produtos na segunda, 18 na terça e 15 na quarta. Qual a média diária de vendas?",["12","18","45","15"],3,"Total = 45; 45 ÷ 3 = 15 produtos por dia.","Divida o total por 3 dias."],
[9,"Básico","Uma urna tem 3 bolas vermelhas e 5 azuis. Qual a probabilidade de sortear uma vermelha?",["3/5","3/8","5/8","1/3"],1,"Favoráveis: 3. Total: 8. P = 3/8.","Total de bolas no denominador."],
[9,"Intermediário","Uma pessoa tem 3 camisetas e 4 bermudas diferentes. De quantas formas pode se vestir usando uma de cada?",["7","10","12","24"],2,"Princípio multiplicativo: 3 × 4 = 12.","Multiplique as possibilidades."],
/* Lote 2: 60 questões novas, 6 por módulo (respostas calculadas e conferidas) */
[0, "Básico", "Qual é o resultado de 4/5 + 6/8?", ["1/20", "3/5", "31/20", "10/13"], 2, "MMC(5,8)=40. 4/5=32/40 e 6/8=30/40. Soma: 31/20. Somar numeradores e denominadores é erro comum.", "Procure um denominador comum."],
[0, "Básico", "Qual é o resultado de 4/6 + 4/5?", ["22/15", "8/15", "2/15", "8/11"], 0, "MMC(6,5)=30. 4/6=20/30 e 4/5=24/30. Soma: 22/15. Somar numeradores e denominadores é erro comum.", "Procure um denominador comum."],
[0, "Intermediário", "Qual é o valor de √64 − 3²?", ["55", "2", "-1", "17"], 2, "√64=8 e 3²=9. 8−9=-1.", "Calcule a raiz e a potência separadamente."],
[0, "Intermediário", "Qual é o valor de √64 − 2³?", ["2", "56", "0", "16"], 2, "√64=8 e 2³=8. 8−8=0.", "Calcule a raiz e a potência separadamente."],
[0, "Básico", "Em uma escola com 200 alunos, 2/5 praticam esporte. Quantos alunos praticam esporte?", ["400", "120", "80", "40"], 2, "200 ÷ 5 = 40. Multiplicando por 2: 80.", "Divida o total pelo denominador e multiplique pelo numerador."],
[0, "Básico", "Em uma escola com 160 alunos, 3/8 praticam esporte. Quantos alunos praticam esporte?", ["60", "20", "480", "100"], 0, "160 ÷ 8 = 20. Multiplicando por 3: 60.", "Divida o total pelo denominador e multiplique pelo numerador."],
[1, "Básico", "3 canetas custam R$ 9,00. Quanto custam 15 canetas, mantendo o preço?", ["R$ 21,00", "R$ 90,00", "R$ 45,00", "R$ 36,00"], 2, "Cada caneta custa R$ 3,00. 15 × R$ 3,00 = R$ 45,00.", "Descubra o preço de uma caneta."],
[1, "Básico", "4 canetas custam R$ 16,00. Quanto custam 8 canetas, mantendo o preço?", ["R$ 16,00", "R$ 20,00", "R$ 64,00", "R$ 32,00"], 3, "Cada caneta custa R$ 4,00. 8 × R$ 4,00 = R$ 32,00.", "Descubra o preço de uma caneta."],
[1, "Intermediário", "Em um mapa com escala 1 : 200.000, dois pontos estão a 7 cm. Qual é a distância real?", ["14 km", "1,4 km", "1.400.000 km", "140 km"], 0, "7 × 200.000 = 1.400.000 cm = 14 km (100 000 cm = 1 km).", "Converta cm para km no final."],
[1, "Intermediário", "Em um mapa com escala 1 : 100.000, dois pontos estão a 6 cm. Qual é a distância real?", ["0,6 km", "600.000 km", "60 km", "6 km"], 3, "6 × 100.000 = 600.000 cm = 6 km (100 000 cm = 1 km).", "Converta cm para km no final."],
[1, "Avançado", "6 operários terminam uma obra em 20 dias. Mantendo o mesmo ritmo, em quantos dias 8 operários terminam a mesma obra?", ["40 dias", "22 dias", "15 dias", "26,67 dias"], 2, "Mais operários, menos dias (grandezas inversas): 6 × 20 = 120 e 120 ÷ 8 = 15.", "Mais operários fazem a obra em menos tempo."],
[1, "Avançado", "12 operários terminam uma obra em 8 dias. Mantendo o mesmo ritmo, em quantos dias 16 operários terminam a mesma obra?", ["16 dias", "10,67 dias", "12 dias", "6 dias"], 3, "Mais operários, menos dias (grandezas inversas): 12 × 8 = 96 e 96 ÷ 16 = 6.", "Mais operários fazem a obra em menos tempo."],
[2, "Básico", "Um produto de R$ 500,00 está com 25% de desconto. Qual é o preço final?", ["R$ 375,00", "R$ 475,00", "R$ 625,00", "R$ 125,00"], 0, "25% de R$ 500,00 = R$ 125,00 de desconto. R$ 500,00 − R$ 125,00 = R$ 375,00.", "Calcule o valor do desconto e subtraia."],
[2, "Básico", "Um produto de R$ 80,00 está com 20% de desconto. Qual é o preço final?", ["R$ 96,00", "R$ 60,00", "R$ 16,00", "R$ 64,00"], 3, "20% de R$ 80,00 = R$ 16,00 de desconto. R$ 80,00 − R$ 16,00 = R$ 64,00.", "Calcule o valor do desconto e subtraia."],
[2, "Intermediário", "Um salário de R$ 2.400,00 teve aumento de 15%. Qual é o novo salário?", ["R$ 2.040,00", "R$ 2.760,00", "R$ 360,00", "R$ 2.415,00"], 1, "Aumento: 15% de R$ 2.400,00 = R$ 360,00. Novo salário: R$ 2.400,00 + R$ 360,00 = R$ 2.760,00.", "Some o aumento ao valor original."],
[2, "Básico", "Quanto é 30% de 240?", ["7200", "168", "8", "72"], 3, "30% = 30/100. 240 × 30/100 = 72.", "Porcentagem é uma fração de denominador 100."],
[2, "Básico", "Quanto é 30% de 80?", ["24", "2400", "2,67", "56"], 0, "30% = 30/100. 80 × 30/100 = 24.", "Porcentagem é uma fração de denominador 100."],
[2, "Avançado", "Uma loja deu dois descontos sucessivos de 20% e de 20% em um produto de R$ 500,00. Qual é o preço final?", ["R$ 400,00", "R$ 300,00", "R$ 20,00", "R$ 320,00"], 3, "Após 20%: R$ 400,00. Após mais 20% sobre esse valor: R$ 320,00. Não se somam os percentuais.", "O segundo desconto incide sobre o preço já reduzido."],
[3, "Básico", "Qual é a solução da equação 6x + 4 = 16?", ["x = 3,33", "x = 12", "x = 2", "x = -1,33"], 2, "6x = 16 − 4 = 12. x = 12 ÷ 6 = 2.", "Isole o termo com x."],
[3, "Básico", "Qual é a solução da equação 6x + 5 = 77?", ["x = 12", "x = 13,67", "x = 7,83", "x = 72"], 0, "6x = 77 − 5 = 72. x = 72 ÷ 6 = 12.", "Isole o termo com x."],
[3, "Avançado", "Qual é a menor raiz da equação x² − 11x + 30 = 0?", ["-5", "6", "11", "5"], 3, "Procure dois números de soma 11 e produto 30: 5 e 6. A menor é 5.", "Soma das raízes = −b/a e produto = c/a."],
[3, "Avançado", "Qual é a menor raiz da equação x² − 7x + 6 = 0?", ["6", "1", "-1", "7"], 1, "Procure dois números de soma 7 e produto 6: 1 e 6. A menor é 1.", "Soma das raízes = −b/a e produto = c/a."],
[3, "Intermediário", "O triplo de um número, menos 9, é igual a 6. Qual é esse número?", ["-3", "-1", "5", "15"], 2, "3x − 9 = 6. 3x = 15. x = 5.", "Traduza a frase em uma equação."],
[3, "Intermediário", "O triplo de um número, menos 6, é igual a 9. Qual é esse número?", ["3", "5", "15", "1"], 1, "3x − 6 = 9. 3x = 15. x = 5.", "Traduza a frase em uma equação."],
[4, "Intermediário", "A soma de dois números é 22 e a diferença entre eles é 18. Qual é o maior número?", ["20", "4", "2", "40"], 0, "x + y = 22 e x − y = 18. Somando: 2x = 40, logo x = 20.", "Some as duas equações para eliminar y."],
[4, "Intermediário", "A soma de dois números é 21 e a diferença entre eles é 9. Qual é o maior número?", ["30", "15", "6", "12"], 1, "x + y = 21 e x − y = 9. Somando: 2x = 30, logo x = 15.", "Some as duas equações para eliminar y."],
[4, "Intermediário", "A soma de dois números é 13 e a diferença entre eles é 3. Qual é o maior número?", ["8", "5", "16", "10"], 0, "x + y = 13 e x − y = 3. Somando: 2x = 16, logo x = 8.", "Some as duas equações para eliminar y."],
[4, "Avançado", "2 cadernos e 1 lápis custam R$ 19,00. 1 caderno e 1 lápis custam R$ 10,00. Quanto custa 1 caderno?", ["R$ 18,00", "R$ 9,00", "R$ 29,00", "R$ 1,00"], 1, "Subtraindo as compras: (2c + l) − (c + l) = R$ 19,00 − R$ 10,00, então c = R$ 9,00.", "Subtraia uma compra da outra."],
[4, "Avançado", "2 cadernos e 1 lápis custam R$ 13,00. 1 caderno e 1 lápis custam R$ 8,00. Quanto custa 1 caderno?", ["R$ 10,00", "R$ 3,00", "R$ 5,00", "R$ 21,00"], 2, "Subtraindo as compras: (2c + l) − (c + l) = R$ 13,00 − R$ 8,00, então c = R$ 5,00.", "Subtraia uma compra da outra."],
[4, "Avançado", "2 cadernos e 1 lápis custam R$ 19,00. 1 caderno e 1 lápis custam R$ 11,00. Quanto custa 1 caderno?", ["R$ 30,00", "R$ 16,00", "R$ 8,00", "R$ 3,00"], 2, "Subtraindo as compras: (2c + l) − (c + l) = R$ 19,00 − R$ 11,00, então c = R$ 8,00.", "Subtraia uma compra da outra."],
[5, "Básico", "Em um triângulo, dois ângulos medem 47° e 40°. Quanto mede o terceiro ângulo?", ["273°", "87°", "93°", "43°"], 2, "A soma dos ângulos internos é 180°. 180 − 47 − 40 = 93°.", "Lembre que a soma é 180°."],
[5, "Básico", "Em um triângulo, dois ângulos medem 52° e 67°. Quanto mede o terceiro ângulo?", ["241°", "61°", "38°", "119°"], 1, "A soma dos ângulos internos é 180°. 180 − 52 − 67 = 61°.", "Lembre que a soma é 180°."],
[5, "Avançado", "Um retângulo tem perímetro 28 cm e um lado de 10 cm. Qual é a sua área?", ["40 cm²", "280 cm²", "100 cm²", "140 cm²"], 0, "Semiperímetro: 14. Outro lado: 14 − 10 = 4. Área: 10 × 4 = 40 cm².", "Descubra o outro lado pelo perímetro."],
[5, "Intermediário", "Qual é a soma dos ângulos internos de um polígono de 9 lados?", ["1620°", "360°", "1440°", "1260°"], 3, "S = (n − 2) × 180° = 7 × 180° = 1260°.", "Divida o polígono em triângulos."],
[5, "Intermediário", "Qual é a soma dos ângulos internos de um polígono de 8 lados?", ["1080°", "360°", "1440°", "1260°"], 0, "S = (n − 2) × 180° = 6 × 180° = 1080°.", "Divida o polígono em triângulos."],
[5, "Básico", "Um triângulo tem base 8 cm e altura 4 cm. Qual é a sua área?", ["32 cm²", "64 cm²", "16 cm²", "12 cm²"], 2, "Área = base × altura ÷ 2 = 8 × 4 ÷ 2 = 16 cm².", "Lembre da divisão por 2."],

const TSVG='<svg viewBox="0 0 120 140" width="104" role="img" aria-label="Ilustração de uma professora de geometria segurando um esquadro"><path d="M30 138c0-26 14-44 30-44s30 18 30 44z" fill="#22e5ff" opacity=".85"/><circle cx="60" cy="52" r="26" fill="#f2c9a0"/><path d="M32 48c0-20 14-30 28-30s28 10 28 30c-8-10-18-14-28-14s-20 4-28 14z" fill="#8b6cff"/><circle cx="50" cy="54" r="7" fill="none" stroke="#22e5ff" stroke-width="2.2"/><circle cx="70" cy="54" r="7" fill="none" stroke="#22e5ff" stroke-width="2.2"/><path d="M57 54h6" stroke="#22e5ff" stroke-width="2"/><path d="M52 68q8 7 16 0" fill="none" stroke="#a0524a" stroke-width="2.2" stroke-linecap="round"/><path d="M96 74v44H62z" fill="rgba(139,108,255,.3)" stroke="#8b6cff" stroke-width="3" stroke-linejoin="round"/><path d="M89 118v-7h7" fill="none" stroke="#8b6cff" stroke-width="2"/></svg>';
function topico(m){return `<p><b>${M[m]}</b></p><p>${TP[m].e}</p><p>${TP[m].x}</p><details><summary>Quero uma dica</summary><p>${TP[m].d}</p></details><details><summary>Ver a resolução do exemplo</summary><p>${TP[m].r}</p></details><button class="b" onclick="PR(${m})">Praticar ${M[m]}</button>`}

function analise(){const t=st.a.length;if(t<5)return `<p>Você respondeu ${t} questão(ões). Ainda não há dados suficientes para avaliar. Faça o Diagnóstico ou um Modo Misto e volte aqui.</p>`;
const r=M.map((m,i)=>{const s=modStat(i);return{i,n:s.n,p:pct(s.ok,s.n)}}),ok=st.a.filter(x=>x.ok).length,rv=r.filter(x=>x.n>=3&&x.p<70).sort((a,b)=>a.p-b.p).slice(0,2);

function profReply(q){const s=nz(q),sim=(XS&&XS.mode=='sim'&&!XS.fin)||st.xs;
if(sim&&/gabarito|resposta|alternativa|certa|correta/.test(s))return '<p>Há um simulado em andamento. Para proteger a avaliação, só posso explicar conteúdos, sem comentar as questões ou as respostas do simulado.</p>';
if(/desempenho|revisar|revisao|estudar|recomend|como estou/.test(s))return analise();

return '<p>No modo demonstração eu só conheço os assuntos do 9º ano listados abaixo. Escolha um:</p>'+M.map((m,i)=>`<button class="b" onclick="TA('${m}')">${m}</button>`).join(' ')}

const fmtIA=t=>'<p>'+esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split(/\n{2,}/).join('</p><p>').replace(/\n/g,'<br>')+'</p>';
async function iaPergunta(){let to;try{const ms=TH.filter(m=>m.t).slice(-8).map(m=>({role:m.r=='u'?'user':'assistant',content:m.t}));
const c=new AbortController();to=setTimeout(()=>c.abort(),25000);
const r=await fetch('/api/professor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:ms,simulado:simAtivo()}),signal:c.signal});
if(!r.ok)return null;const j=await r.json();return j&&j.texto?String(j.texto):null}catch(e){return null}finally{clearTimeout(to)}}
async function TA(t){t=String(t).trim().slice(0,300);if(!t||TT)return;TH.push({r:'u',h:esc(t),t});TT=true;render();tfx();

else{tx=await iaPergunta();if(tx){IAON=true;h=fmtIA(tx)}else{IAON=false;h=profReply(t)}}}catch(e){h='<p>Algo deu errado. Tente de novo.</p>'}
TH.push(tx?{r:'p',h,t:tx}:{r:'p',h});TT=false;if(V=='prof')render();tfx()}

function prof(){const sg=["Como somar frações?","Como calcular porcentagem?","Explique regra de três","Como resolver equação do 2º grau?","Como calcular probabilidade?","O que devo revisar?"];
